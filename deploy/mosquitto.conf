# Mosquitto — gelistirme/demo yapilandirmasi.
#
# BU DOSYA VARSAYILAN DEMO YOLUDUR: 1883, anonim. F-27 buna DOKUNMADI.
#
# 8883 uzerinde TLS + istemci sertifikasi (mTLS) ve cihaz bazli topic yetkisi AYRI BIR
# PROFILDE uygulanmistir ve canli brokerda olculmustur (18 Eylul, F-27):
#   deploy/mosquitto-mtls.conf + deploy/mosquitto.acl + deploy/compose.mtls.yaml
#   docker compose -f deploy/compose.yaml --profile mtls up -d mosquitto-mtls
# Olcum ve bilincli sinirlar: docs/15-guvenlik-kvkk.md §5.1.
#
# Saha cihazi yalnizca disa baglanir, gelen port yoktur (IEC 62443 bolge/iletken yaklasimi).
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# Kenar kopuklugunda biriken mesajlarin backfill'i icin makul siniri:
max_queued_messages 10000
max_inflight_messages 100
