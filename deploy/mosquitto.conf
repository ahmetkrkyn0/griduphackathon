# Mosquitto — gelistirme/demo yapilandirmasi.
#
# URETIMDE (docs/15-guvenlik-kvkk.md): 8883 uzerinde TLS + istemci sertifikasi (mTLS),
# cihaz bazli topic yetkisi, anonim erisim KAPALI. Saha cihazi yalnizca disa baglanir,
# gelen port yoktur (IEC 62443 bolge/iletken yaklasimi).
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# Kenar kopuklugunda biriken mesajlarin backfill'i icin makul siniri:
max_queued_messages 10000
max_inflight_messages 100
