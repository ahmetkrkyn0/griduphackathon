# Kenar ve cihaz simulasyonu — KISI A'NIN DOSYASI.
# Ana compose bunu `include` ile ceker (PLAN.md kural 6).
#
# Faz 1 (TA1): panosim artik libs/panoalgo fizik uretecini kullanir.
# Faz 3'te mpr-sim ve tvoc-sim servisleri aktif edilecek (asagida hazir, yorumda).
services:
  panosim:
    build:
      # Context repo koku: imaj hem sim/ hem libs/panoalgo'yu icerir.
      context: ..
      dockerfile: sim/Dockerfile
    container_name: gridup-panosim
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      CONTRACTS_DIR: /contracts
      SIM_PANELS: ${SIM_PANELS:-3}
      SIM_PERIOD_S: ${SIM_PERIOD_S:-10}
      SIM_SPEED: ${SIM_SPEED:-60}
      SIM_SEED: ${SIM_SEED:-1000}
      SIM_PREFIX: ${SIM_PREFIX:-ADM}
      # K3 karari (15 Eylul): fizik HIZLANDIRILMIS kalir, yayinlanan ts DUVAR SAATIDIR.
      # Eskiden ts de simule zamandi ve SIM_SPEED=60 ile duvar saatinin onune geciyordu
      # (11 dk kosuda 10,5 saat ileri). Arayuzun trend grafikleri `to = new Date()`
      # penceresi kullandigi icin yeni veri grafige hic girmiyordu. Gerekce: docs/14 §7.
      # 0 = eski davranis (simule zaman damgasi).
      SIM_WALL_CLOCK: ${SIM_WALL_CLOCK:-1}
    volumes:
      - ../contracts:/contracts:ro
      - ../data:/data
    depends_on:
      mosquitto:
        condition: service_started

  # --- Faz 3 (TA3): gercek register adresleriyle cihaz simulatorleri ---
  # Ikisi de kendi kilavuzlarindaki PDU adreslerinde cevap verir; juri QModMaster
  # ile baglanip okur. Register mantigi libs/panoalgo/panoalgo/devices.py icinde
  # ve orada testlerle kilitli.
  mpr-sim:
    build:
      context: ..
      dockerfile: sim/Dockerfile
    container_name: gridup-mpr-sim
    restart: unless-stopped
    command: ["python", "mpr53cs_sim.py", "--port", "5020", "--slave-id", "1", "--ct", "500"]
    ports: ["5020:5020"]      # Modbus TCP; demoda QModMaster buraya baglanir
    environment:
      CONTRACTS_DIR: /contracts
    volumes:
      - ../contracts:/contracts:ro

  tvoc-sim:
    build:
      context: ..
      dockerfile: sim/Dockerfile
    container_name: gridup-tvoc-sim
    restart: unless-stopped
    # DIKKAT: varsayilan slave ID 248'dir ve kilavuza gore bu "haberlesme KAPALI"
    # demektir — cihaz hicbir isteme cevap vermez. Demoda once bu gosterilir, sonra
    # SIM_TVOC_ID=10 ile acilir. Sahada en sik yasanan devreye alma hatasi budur.
    command: ["python", "tvoc2_sim.py", "--port", "5021", "--slave-id", "${SIM_TVOC_ID:-248}"]
    ports: ["5021:5021"]
    environment:
      CONTRACTS_DIR: /contracts
    volumes:
      - ../contracts:/contracts:ro
