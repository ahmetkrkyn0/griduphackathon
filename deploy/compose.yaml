# On-prem yigin — ANA COMPOSE (Kisi B'nin dosyasi).
#
# UC PARCALI (PLAN.md Bolum B, kural 6): herkes kendi servisini kendi dosyasinda
# tutar, boylece tek compose dosyasi uc kisinin cakisma noktasi olmaz.
#   compose.yaml            -> B (broker, DB, backend, grafana)
#   compose.sim.yaml        -> A (veri ureteci + cihaz simulatorleri)
#   compose.frontend.yaml   -> C (operasyon arayuzu)
#
# Calistirma (repo kokunden):
#   docker compose -f deploy/compose.yaml up -d --build
#   docker compose -f deploy/compose.yaml ps
#   docker compose -f deploy/compose.yaml down -v
#
# `include` Docker Compose v2.20+ gerektirir:  docker compose version
# Internet kablosu cikarilmis halde de calisir (PLAN.md GK4) — imajlar bir kez cekilir.
name: gridup

include:
  - path: compose.sim.yaml
  - path: compose.frontend.yaml

services:
  mosquitto:
    # 2.0 bir yama serisidir, yama cikinca kayar; digest ile sabitlendi (GK10).
    image: eclipse-mosquitto:2.0@sha256:212f89e1eaeb2c322d6441b64396e3346026674db8fa9c27beac293405c32b3c
    container_name: gridup-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqttdata:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/uptime' -C 1 -W 3 -q 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb:
    # GK10: `latest-pg16` KAYAN bir etiketti — docs/09'daki olcumler (TimescaleDB 2.30.0 /
    # PostgreSQL 16.15) bugun ceken biri icin tekrar uretilebilir degildi. Digest, o olcumun
    # yapildigi imaji sabitler. Surum yukseltmek isteyen digest'i bilerek degistirir.
    image: timescale/timescaledb:latest-pg16@sha256:75d58b53f3337a6babd3a1cce5e503f2300bdede62dd7d743651deb1a95b6d76
    container_name: gridup-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gridup}
      POSTGRES_DB: gridup
    # Docker'in /dev/shm varsayilani 64 MB: PostgreSQL paralel isciler (VACUUM indeks temizligi, buyuk paralel
    # sorgular) dinamik paylasimli bellegi burada acar ve "No space left on device" ile duser (13 Eyl'de
    # yuk testi sonrasi VACUUM'da olculdu: 67 MB segment istendi). docs/07b Y10.
    shm_size: 1gb
    ports:
      - "5432:5432"
    volumes:
      - tsdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gridup"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      # Context repo koku: imaj hem backend/app'i hem libs/panoalgo'yu icerir (TB2 Adim 4).
      context: ..
      dockerfile: backend/Dockerfile
    container_name: gridup-backend
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      DB_DSN: postgresql://postgres:${DB_PASSWORD:-gridup}@timescaledb:5432/gridup
      # Sozlesmeler salt okunur baglanir: esik/adres degisince yeniden build GEREKMEZ
      CONTRACTS_DIR: /contracts
      ALARM_TICK_S: ${ALARM_TICK_S:-5}
      # --- Operator kimlik dogrulama (F-19). "kullanici:rol:belirtec" uclulerini virgulle ayirin.
      # Roller: izleyici < operator < muhendis. Yalnizca YAZMA uclarini (onay/raf) korur.
      # BOS BIRAKILIRSA KIMLIK DOGRULAMA KAPANIR ve onay/raf belirtecsiz kabul edilir;
      # denetim izine "anonim (kimlik dogrulama kapali)" yazilir. Durum GET /health
      # `auth.enabled` alaninda GORUNUR ve acilista uyari loglanir.
      # Belirtecler deploy/.env'den gelir; .env GITIGNORE'DADIR (GK9).
      GRIDUP_OPERATORS: ${GRIDUP_OPERATORS:-}
      # --- Bildirim (TB2). Degerler deploy/.env'den; bos kanal kapali demektir. ---
      # SMS birincil kanal: sanal modem varsayilan; gercek modemde yalnizca bu satir degisir
      SMS_DEVICE: ${SMS_DEVICE:-socket://gsm-modem:7000}
      SMS_BAUD: ${SMS_BAUD:-115200}
      ALERT_RECIPIENTS: ${ALERT_RECIPIENTS:-}
      ALERT_ESCALATION: ${ALERT_ESCALATION:-}
      CALL_RING_S: ${CALL_RING_S:-20}
      PORTAL_URL: ${PORTAL_URL:-http://gridup.local}
      # Gunluk P3/SYS ozetinin saati (HH:MM, SUNUCU saati = konteynerde UTC).
      # `:-` DEGIL `-`: tanimsizsa kodun varsayilani (08:00), BOS birakilirsa ozet KAPALI.
      DIGEST_AT: ${DIGEST_AT-08:00}
      # WhatsApp ikincil kanal (sirket disina cikan tek kanal, kapatilabilir)
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      WHATSAPP_RECIPIENTS: ${WHATSAPP_RECIPIENTS:-}
      WHATSAPP_TEMPLATE: ${WHATSAPP_TEMPLATE:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v25.0}
      # --- SCADA Modbus TCP ag gecidi (TB3). Varsayilan SALT OKUNUR ve yalnizca ozel aglardan. ---
      # Harita: contracts/modbus-map.yaml -> docs/03-modbus-haritasi.md. Konteyner icinde port hep 502.
      MODBUS_ENABLED: ${MODBUS_ENABLED:-1}
      MODBUS_TCP_PORT: 502
      MODBUS_WRITE_PASSWORD: ${MODBUS_WRITE_PASSWORD:-}
      MODBUS_UNITS: ${MODBUS_UNITS:-}
      MODBUS_ALLOWED_CLIENTS: ${MODBUS_ALLOWED_CLIENTS:-}
      # --- IEC 60870-5-104 kontrollu istasyon (TB3 Adim 8). Ayni birim eslemesi (ortak adres = birim), SALT OKUNUR. ---
      # Nokta plani: docs/04-iec104-haritasi.md. Konteyner icinde port hep 2404.
      IEC104_ENABLED: ${IEC104_ENABLED:-1}
      IEC104_PORT: 2404
      IEC104_ALLOWED_CLIENTS: ${IEC104_ALLOWED_CLIENTS:-}
    volumes:
      - ../contracts:/contracts:ro
    ports:
      - "8000:8000"
      - "${MODBUS_TCP_PORT:-502}:502"
      - "${IEC104_PORT:-2404}:2404"
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_started
      gsm-modem:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Sanal GSM modem (TB2): gercek modemin AT komut arayuzu, donanim alinmadan (PLAN.md GK3).
  # AT komut kaydi + PDU dokumu: deploy/runtime/sms-log.txt (git disi; numara icerir, GK9).
  # Gelen SMS (cift yonlu onay) enjeksiyonu yalnizca bu makineden:
  #   python scripts/virtual_gsm_modem.py inject --control localhost:7001 --sender +905550000001 --text "1 42"
  gsm-modem:
    build:
      # backend ile AYNI imaj (ayni Dockerfile, ayni context) — ikinci bir imaj kurmaya
      # gerek yok, sanal modem yalnizca pyserial ve stdlib kullanir. Context repo koku
      # olmali: backend/Dockerfile artik libs/panoalgo'yu da kopyaliyor (TB2 Adim 4).
      context: ..
      dockerfile: backend/Dockerfile
    container_name: gridup-gsm-modem
    restart: unless-stopped
    command: ["python", "/scripts/virtual_gsm_modem.py", "serve", "--port", "7000", "--control-port", "7001", "--log", "/runtime/sms-log.txt"]
    environment:
      PYTHONPATH: /srv
    volumes:
      - ../scripts:/scripts:ro
      - ./runtime:/runtime
    ports:
      - "127.0.0.1:7001:7001"

  grafana:
    # 11.2.0 kesin bir yama surumu; butunluk icin digest ile de sabitlendi (GK10).
    image: grafana/grafana:11.2.0@sha256:408afb9726de5122b00a2576763a8a57a3c86d5b0eff5305bc994ceb3eb96c3f
    container_name: gridup-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      # Kontrol odasi ekrani: giris ekrani olmadan acilir (yalnizca ic agda)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: dark
      DB_PASSWORD: ${DB_PASSWORD:-gridup}
    volumes:
      - ./grafana:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      timescaledb:
        condition: service_healthy

volumes:
  tsdata:
  mqttdata:
  grafanadata:
