# Mosquitto — mTLS yetki tezgahi (F-27). VARSAYILAN DEMO YOLU DEGILDIR.
#
# Varsayilan yigin deploy/mosquitto.conf ile 1883'te anonim calisir ve bu dosya onu
# HIC etkilemez. Bu yapilandirma yalnizca "mtls" compose profiliyle ayaga kalkar:
#
#   bash scripts/sertifika-uret.sh
#   docker compose -f deploy/compose.yaml --profile mtls up -d mosquitto-mtls
#   backend/.venv/Scripts/python scripts/mtls_yetki_testi.py
#
# NE YAPAR
#   * 8883'te TLS; istemci sertifikasi ZORUNLU (require_certificate), anonim erisim KAPALI.
#   * Kullanici adi sertifikanin CN'inden gelir (use_identity_as_username), topic yetkisi
#     deploy/mosquitto.acl icindeki kaliplarla o ada baglanir.
#
# NE YAPMAZ — dokumana da boyle yazildi (docs/15 §5.1):
#   * Sertifika IPTALI YOK. mosquitto 2.0'da bir `crlfile` secenegi vardir ama bu
#     teslimde HIC DENENMEDI: iptal listesi uretilmedi ve iptal edilmis bir
#     sertifikanin reddedildigi OLCULMEDI. Sizan bir pano sertifikasi gecerliligi
#     boyunca kullanilabilir. Hem mekanizma hem isletimi F-28'in konusudur.
#   * Sifre takimi kisiti (`ciphers` / `ciphers_tls1.3`) BILEREK YAZILMADI: hangi takimlarin
#     istenecegi IEC 62351-3'un konusudur ve o metne erisilmedi (GK10). Gerekcesini
#     gosteremeyecegimiz bir liste yazmak, kisitlamamaktan daha kotudur.
#   * `tls_version` PINLENMEDI: OpenSSL'in pazarlik ettigi en yuksek surum kullanilir
#     (olculen: TLS 1.3). Gozlem kolayligi icin 1.2'ye dusurmek guvenlik gerilemesi olurdu.
#
# Saha cihazi yalnizca DISA baglanir, gelen portu yoktur (IEC 62443 bolge/iletken).

per_listener_settings true

listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key
require_certificate true
use_identity_as_username true
allow_anonymous false
acl_file /mosquitto/config/mosquitto.acl

# Tezgah kalici durum TUTMAZ: onceki kosudan kalan retained mesaj, olcumun pozitif
# kontrolunu sahte gecirebilirdi (docs/15 §5.1, Y6).
persistence false

log_dest stdout
# Ucuncu bagimsiz sinyal: "Denied PUBLISH from ..." satiri yalnizca bu seviyede gorunur.
# Olcum betigi bu satiri KENDI kosusuna ozgu istemci kimligiyle arar.
log_type all
