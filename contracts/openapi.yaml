# Merkez API — frontend'in tukettigi TEK arayuz.
# DONMUSTUR (PLAN.md kural 3). Ureten: Kisi B (backend/). Tuketen: Kisi C (frontend/).
# Kisi C alan adi UYDURMAZ; ihtiyac varsa contracts/changes/ altina oneri dosyasi acar.
openapi: 3.1.0
info:
  title: Grid Up — Pano Beyni Merkez API
  # v1.1.0 (18 Eylul 2026): GET /fleet/health eklendi. Yalnizca EKLEME, geri uyumlu.
  #   Gerekce: contracts/changes/2026-09-14-fleet-health-bulk.md
  # v1.2.0 (18 Eylul 2026): onay/raf govdesinden `by` KALKTI, securitySchemes eklendi (F-19).
  #   GERI UYUMLU DEGIL: onaylayanin adi artik govdeden degil Authorization basligindan
  #   turer. Eski istemcinin govdeye yazdigi `by` sessizce YOK SAYILIR (reddedilmez).
  #   Gerekce: contracts/changes/2026-09-18-kimlik-dogrulama.md
  # v1.3.0 (18 Eylul 2026): varlik kutugu (F-21). AssetRegistry semasi, PanelDetail.asset,
  #   PanelSummary'ye uc alan (abone_sayisi, kritiklik, sonraki_bakim_at) ve GET/POST
  #   /fleet/assets. Yalnizca EKLEME, geri uyumlu: yeni alanlarin hicbiri required degil ve
  #   kunye ice aktarilmamissa null doner.
  #   Gerekce: contracts/changes/2026-09-18-varlik-kutugu.md
  version: 1.3.0
  description: |
    On-prem izleme platformunun HTTP arayuzu. Tamami sirket ici aginda calisir,
    public cloud bagimliligi yoktur (PLAN.md GK4).
servers:
  - url: http://localhost:8000
    description: Gelistirme (dogrudan backend)
  - url: /
    description: Uretim (nginx arkasinda, frontend ile ayni koken)

tags:
  - name: panels
    description: Filo ve pano detayi
  - name: alarms
    description: ISA-18.2 alarm yasam dongusu
  - name: events
    description: Olay ve kara kutu
  - name: assets
    description: Varlik kutugu (CBS'den ice aktarilan kunye)
  - name: system

paths:
  /health:
    get:
      tags: [system]
      summary: Servis sagligi
      responses:
        "200":
          description: Calisiyor
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  version: { type: string }
                  mqtt: { type: boolean }
                  db: { type: boolean }
                  auth:
                    type: object
                    description: >
                      Kimlik dogrulamanin ACIK olup olmadigi. Kapali olmak SESSIZ bir
                      varsayilan olmamali: arayuz ve isletmeci durumu tek istekte
                      gorebilmeli (F-19).
                    properties:
                      enabled: { type: boolean }
                      users: { type: array, items: { type: string } }
                      protects:
                        type: array
                        items: { type: string }
                        description: "Belirtec isteyen uclarin listesi"

  /api/v1/panels:
    get:
      tags: [panels]
      summary: Filo listesi (risk skoruna gore siralanabilir)
      parameters:
        - { name: sort, in: query, schema: { type: string, enum: [risk, last_seen, pano_id], default: risk } }
        - { name: min_risk, in: query, schema: { type: integer, minimum: 0, maximum: 100 } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 2000 } }
      responses:
        "200":
          description: Pano ozetleri
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PanelSummary" }

  /api/v1/panels/{pano_id}:
    get:
      tags: [panels]
      summary: Tek pano detayi (dijital ikizi besler)
      parameters:
        - $ref: "#/components/parameters/PanoId"
      responses:
        "200":
          description: Pano detayi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanelDetail" }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/panels/{pano_id}/series:
    get:
      tags: [panels]
      summary: Zaman serisi (trend ve I^2-dT korelasyon grafikleri icin)
      parameters:
        - $ref: "#/components/parameters/PanoId"
        - name: tags
          in: query
          required: true
          description: "Virgulle ayrilmis etiketler, or. t_conn.GIRIS_L2.dt_c,elec.i_ph.1,k_index.DSYA3_L2"
          schema: { type: string }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: step, in: query, description: "ornekleme araligi, or. 10s / 1m / 15m", schema: { type: string, default: 1m } }
      responses:
        "200":
          description: "etiket -> [[ts_ms, deger]] dizisi"
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: array
                    prefixItems:
                      - { type: integer, description: "unix ms" }
                      - { type: [number, "null"] }

  /api/v1/alarms:
    get:
      tags: [alarms]
      summary: Alarm konsolu listesi
      parameters:
        - { name: state, in: query, schema: { type: string, default: "active,acked" }, description: "active,acked,shelved,cleared" }
        - { name: prio, in: query, schema: { type: string }, description: "P1,P2,P3,INFO,SYS" }
        - { name: pano_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
      responses:
        "200":
          description: Alarmlar (en yeni once)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Alarm" }

  /api/v1/alarms/{alarm_id}/ack:
    post:
      tags: [alarms]
      summary: Alarm onayi (ISA-18.2)
      parameters:
        - $ref: "#/components/parameters/AlarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
                channel: { type: string, enum: [ui, sms, scada], default: ui }
      security:
        - operatorToken: []
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Zaten onaylanmis veya temizlenmis"

  /api/v1/alarms/{alarm_id}/shelve:
    post:
      tags: [alarms]
      summary: Alarmi süreli ve gerekceli rafa al (P1 rafa alinamaz)
      parameters:
        - $ref: "#/components/parameters/AlarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes, reason]
              properties:
                minutes: { type: integer, minimum: 1, maximum: 480 }
                reason: { type: string, minLength: 3 }
      security:
        - operatorToken: []
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >
            P1 alarm rafa alinamaz (alarm-codes.yaml suppressible=false),
            VEYA belirtecin rolu yetmiyor ('operator' gerekir).

  /api/v1/events/{event_id}/blackbox:
    get:
      tags: [events]
      summary: Olay oncesi 72 saatlik kara kutu
      parameters:
        - { name: event_id, in: path, required: true, schema: { type: string } }
        - { name: window_h, in: query, schema: { type: integer, default: 72 } }
      responses:
        "200":
          description: Olay + oncesindeki sinyaller + zaman cizelgesi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Blackbox" }

  /api/v1/fleet/kpi:
    get:
      tags: [system]
      summary: Filo KPI'lari (ISA-18.2 hedefleriyle karsilastirmali)
      responses:
        "200":
          description: KPI ozeti
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetKpi" }

  /api/v1/fleet/health:
    get:
      tags: [system]
      summary: Tum filonun cihaz sagligi — tek istekte
      description: >
        Cihaz Sagligi ekrani icin. Bu uctan ONCE ekran gorunen her pano icin ayri ayri
        GET /panels/{id} cagiriyordu (sinirli eszamanlilikla); 20 panoda sorun degil,
        100+ panoda (GK7 hedefi) yavasliyordu. PanelSummary gibi HAFIF bir listedir:
        PanelDetail'in nokta dizisini, ortam ve elektrik bloklarini tasimaz.
      responses:
        "200":
          description: Filo genelinde cihaz sagligi listesi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PanelHealth" }

  /api/v1/fleet/assets:
    get:
      tags: [assets]
      summary: Varlik kutugu — filonun kunyesi ve kapsama orani
      description: >
        Panolarin CBS'den ice aktarilan kunyesi (F-21). `kapsama` alani kac panonun
        kunyesi oldugunu SAYIYLA soyler: eksiklik gizlenemez. Kunyesi olmayan pano
        listede yine gorunur ve alanlari null doner — bos hucre "veri yok" demektir,
        sifir demek DEGILDIR.
      responses:
        "200":
          description: Kunye listesi + kapsama ozeti
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetFleet" }
    post:
      tags: [assets]
      summary: CBS aktarimindan varlik kunyesi ice aktar
      description: >
        Kunyeyi CBS disa aktarimindan toplu olarak yazar (F-21). Biz KAYNAK DEGIL
        TUKETICIYIZ: bu uc bir varlik ana kaydi olusturmaz, CBS'deki kaydi buraya
        kopyalar. `kunye_kaynak` ZORUNLUDUR — kaynagi yazilmayan kunye kabul edilmez.
        Bilinmeyen pano_id REDDEDILIR (yeni pano yaratmaz).
        `uretici` ve `seri_no` gonderilmezse bos kalir; UYDURULMAZ.
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetImport" }
      responses:
        "200":
          description: Ice aktarim ozeti
          content:
            application/json:
              schema:
                type: object
                required: [guncellenen, kapsama]
                properties:
                  guncellenen: { type: integer, description: "kunyesi yazilan pano sayisi" }
                  kapsama: { $ref: "#/components/schemas/AssetCoverage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    PanoId:
      name: pano_id
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Z]{3}-[0-9]{5}$" }
    AlarmId:
      name: alarm_id
      in: path
      required: true
      schema: { type: string }

  responses:
    Ok:
      description: Basarili
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean }
    NotFound:
      description: Bulunamadi
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: >
        Belirtec yok, bicimi desteklenmiyor veya gecersiz. `WWW-Authenticate: Bearer`
        basligi doner. NOT: operator tablosu bos birakilirsa kimlik dogrulama KAPALIDIR
        ve bu yanit hic uretilmez; durum GET /health `auth.enabled` alanindan okunur.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "Kimlik dogru ama rol yetmiyor (izleyici < operator < muhendis)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  securitySchemes:
    operatorToken:
      type: http
      scheme: bearer
      description: >
        On-prem operator belirteci (F-19). Kurumsal SSO/OIDC DEGILDIR: belirtecler
        yapilandirmada duran paylasilan sirlardir; parola, oturum suresi, yenileme ve
        iptal listesi yoktur. GK4 public cloud kimlik saglayicisini yasakladigi icin
        bulut IdP kullanilamaz. Yalnizca YAZMA uclarini (onay/raf) korur; okuma uclari
        ve WebSocket akisi belirtec istemez. Ayrinti: docs/15-guvenlik-kvkk.md §5.

  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string }

    AssetRegistry:
      type: object
      description: >
        Panonun CBS'den ice aktarilan kunyesi (F-21). Bu bir VARLIK ANA KAYDI DEGILDIR:
        EPDK CBS usul ve esaslari panoyu zaten tekil kodla tutmayi zorunlu kiliyor, yani
        kimlik musteride var ve biz tuketiciyiz. Ice aktarilmamis her alan null'dur;
        null "olcmedik/almadik" demektir, sifir demek degildir.
      properties:
        cbs_kodu:
          type: [string, "null"]
          description: >
            EPDK CBS tekil sebeke unsuru kodu. Urun seviyesinde BIRINCIL kimliktir;
            veritabani birincil anahtari pano_id olarak KALIR (yabanci anahtarlar ona bagli).
            EPDK Kalite Yonetmeligi Madde 8/2'nin "yer" alanindaki tekil kodu besler.
        fider_id:
          type: [string, "null"]
          description: "Panonun beslendigi fider. F-22 es zamanli susmayi bu alana gore gruplar."
        il:    { type: [string, "null"], description: "Madde 8/2 'yer'; pano_id onekinden TURETILMEZ" }
        ilce:  { type: [string, "null"] }
        abone_sayisi:
          type: [integer, "null"]
          description: >
            Madde 8/2 "etkilenen kullanici sayisi". Risk matrisinin ETKI eksenidir:
            sayilabilir bir buyukluktur ve bir taksonomi icat etmeyi gerektirmez.
        trafo_kva:
          type: [integer, "null"]
          description: >
            Pano BASINA trafo gucu. pano_type ('1600kVA-dahili') kVA'yi tasir ama filodaki
            her panoda AYNIDIR; sabit bir alani etki gibi gostermek yaniltici olurdu.
        kritiklik:
          type: [string, "null"]
          enum: [kritik, yuksek, orta, dusuk, null]
          description: >
            CBS/varlik yonetiminden ICE AKTARILAN etiket; bizim tanimladigimiz bir sozluk
            DEGILDIR. Erisilebilir bir standart siniflandirma bulunamadi ve GK10 geregi
            erisemedigimiz bir metnin madde numarasi yazilmaz. Sinirli sozluk, uydurma veri
            uretmek icin degil AKTARIMI DOGRULAMAK icindir.
        uretici:
          type: [string, "null"]
          description: >
            UYDURULMAZ, bos birakilir. Bu teslimde hicbir panoda doldurulmadi ve demo tohumu
            da doldurmaz (GK3: gercek bir CBS aktarimina erisim yok).
        seri_no:
          type: [string, "null"]
          description: "UYDURULMAZ, bos birakilir (bkz. uretici)."
        son_bakim_at:     { type: [string, "null"], format: date-time }
        sonraki_bakim_at: { type: [string, "null"], format: date-time, description: "bakim vadesi rozetini besler" }
        kunye_kaynak:
          type: [string, "null"]
          description: >
            Kunyenin NEREDEN geldigi (hangi CBS aktarimi). Kaynagi yazilmayan kunye kabul
            edilmez: "alan acip bos birakmak" ile "tanimli kaynagi olan alan" farki budur.
        kunye_at: { type: [string, "null"], format: date-time, description: "ice aktarim ani" }

    AssetCoverage:
      type: object
      description: "Kapsama SAYIYLA verilir ki eksiklik gizlenemesin (GK10)."
      required: [panolar, kunyeli]
      properties:
        panolar:  { type: integer, description: "filodaki toplam pano" }
        kunyeli:  { type: integer, description: "cbs_kodu girilmis pano" }
        fiderli:  { type: integer, description: "fider_id girilmis pano (F-22 bunu kullanir)" }
        aboneli:  { type: integer, description: "abone_sayisi girilmis pano (etki ekseni)" }

    AssetFleet:
      type: object
      required: [kapsama, panolar]
      properties:
        kapsama: { $ref: "#/components/schemas/AssetCoverage" }
        panolar:
          type: array
          items:
            type: object
            required: [pano_id]
            properties:
              pano_id: { type: string }
              name:    { type: string }
              asset:   { oneOf: [{ $ref: "#/components/schemas/AssetRegistry" }, { type: "null" }] }

    AssetImport:
      type: object
      required: [kunye_kaynak, panolar]
      properties:
        kunye_kaynak:
          type: string
          minLength: 1
          description: "ZORUNLU. Aktarimin kimligi, or. 'ADM CBS disa aktarim 2026-09-18'."
        panolar:
          type: array
          minItems: 1
          items:
            type: object
            required: [pano_id]
            description: >
              pano_id disindaki her alan istege baglidir; GONDERILMEYEN alan DEGISTIRILMEZ
              (mevcut deger korunur). Bir alani temizlemek icin acikca null gonderilir.
            properties:
              pano_id:      { type: string }
              cbs_kodu:     { type: [string, "null"] }
              fider_id:     { type: [string, "null"] }
              il:           { type: [string, "null"] }
              ilce:         { type: [string, "null"] }
              abone_sayisi: { type: [integer, "null"], minimum: 0 }
              trafo_kva:    { type: [integer, "null"], minimum: 0 }
              kritiklik:    { type: [string, "null"], enum: [kritik, yuksek, orta, dusuk, null] }
              uretici:      { type: [string, "null"] }
              seri_no:      { type: [string, "null"] }
              son_bakim_at:     { type: [string, "null"], format: date-time }
              sonraki_bakim_at: { type: [string, "null"], format: date-time }

    PanelSummary:
      type: object
      required: [pano_id, name, risk_score, risk_mode, last_seen, comms_ok]
      properties:
        pano_id: { type: string }
        name: { type: string, description: "or. Efeler TM-14" }
        lat: { type: [number, "null"] }
        lon: { type: [number, "null"] }
        pano_type: { type: string, description: "1600kVA-dahili" }
        risk_score: { type: integer, minimum: 0, maximum: 100 }
        risk_mode: { type: string, description: "alarm-codes.yaml hypotheses[].code" }
        risk_trend: { type: string, enum: [up, flat, down] }
        top_alarm: { type: [string, "null"], description: "en yuksek oncelikli aktif alarm kodu" }
        top_prio: { type: [string, "null"], enum: [P1, P2, P3, INFO, SYS, null] }
        ttl_h: { type: [number, "null"], description: "sinira kalan sure (saat)" }
        last_seen: { type: string, format: date-time }
        comms_ok: { type: boolean }
        baseline_day: { type: integer }
        # --- varlik kutugu (F-21). Kunye ice aktarilmamissa UCU DE null doner.
        # Ozete yalnizca bu uc alan girdi: risk matrisinin etki ekseni (abone_sayisi),
        # onceliklendirme (kritiklik) ve bakim vadesi rozeti (sonraki_bakim_at). Kunyenin
        # tamami PanelDetail.asset'tedir — filo listesi 1.000 pano tasiyabilmeli.
        abone_sayisi: { type: [integer, "null"], description: "etki ekseni; null = kunye yok" }
        kritiklik: { type: [string, "null"], enum: [kritik, yuksek, orta, dusuk, null] }
        sonraki_bakim_at: { type: [string, "null"], format: date-time }

    ConnPoint:
      type: object
      required: [pt, t_c, dt_c]
      properties:
        pt: { type: string }
        label: { type: string, description: "Turkce gosterim adi, or. 'Giris L2'" }
        t_c: { type: number }
        dt_c: { type: number }
        k: { type: [number, "null"] }
        k_ratio: { type: [number, "null"] }
        tau_s: { type: [number, "null"] }
        ttl_h: { type: [number, "null"] }
        excited: { type: boolean }
        q: { type: integer, description: "0 = temiz" }
        state: { type: string, enum: [normal, warn, alarm, critical, stale] }

    Env:
      type: object
      properties:
        t_low_c: { type: number }
        rh_low_pct: { type: number }
        td_low_c: { type: number }
        td_margin_k: { type: number }
        t_up_c: { type: number }
        rh_up_pct: { type: number }
        dt_air_k: { type: number }
        voc_idx: { type: [number, "null"] }
        door_open: { type: boolean }

    Elec:
      type: object
      properties:
        i_ph: { type: array, items: { type: number } }
        i_n: { type: number }
        u_ph: { type: array, items: { type: number } }
        thd_i: { type: array, items: { type: number } }
        cosphi: { type: number }
        unbal_pct: { type: number }
        mpr_comm_ok: { type: boolean }

    Tvoc:
      type: object
      properties:
        trips: { type: integer }
        state: { type: integer }
        last_trip_at: { type: [string, "null"], format: date-time }
        last_det_label: { type: [string, "null"], description: "or. 'X2:4' — pano icindeki konum" }
        prot_health_ok: { type: boolean }
        comm_ok: { type: boolean }

    DeviceHealth:
      type: object
      properties:
        uptime_s: { type: integer }
        nodes_ok: { type: integer }
        nodes_total: { type: integer }
        rssi_dbm: { type: number }
        vbak_pct: { type: number }
        buffered: { type: integer }
        maint_mode: { type: boolean }
        fw: { type: string }

    PanelHealth:
      type: object
      description: >
        GET /fleet/health satiri. Alanlar DeviceHealth ile ayni adlari tasir; pano_id,
        name, last_seen ve comms_ok PanelSummary ile ayni anlamdadir. Telemetri hic
        gelmemis bir pano icin saglik alanlari null doner — olmayan veri 0 gibi
        gosterilmez (0 dBm gecerli bir RSSI'dir, "bilinmiyor" degildir).
      required: [pano_id, name, last_seen, comms_ok]
      properties:
        pano_id: { type: string }
        name: { type: string }
        nodes_ok: { type: [integer, "null"] }
        nodes_total: { type: [integer, "null"] }
        rssi_dbm: { type: [number, "null"] }
        vbak_pct: { type: [number, "null"] }
        buffered: { type: [integer, "null"] }
        maint_mode: { type: [boolean, "null"] }
        fw: { type: [string, "null"] }
        baseline_day: { type: integer }
        last_seen: { type: string, format: date-time }
        comms_ok: { type: boolean }

    PanelDetail:
      type: object
      required: [pano_id, ts, points, env, elec, health]
      properties:
        pano_id: { type: string }
        name: { type: string }
        pano_type: { type: string }
        ts: { type: string, format: date-time }
        risk_score: { type: integer }
        risk_mode: { type: string }
        risk_contributions:
          type: object
          additionalProperties: { type: number }
          description: "alarm kodu -> katki (0-1); 'Neden?' bolumunu besler"
        points: { type: array, items: { $ref: "#/components/schemas/ConnPoint" } }
        env: { $ref: "#/components/schemas/Env" }
        elec: { $ref: "#/components/schemas/Elec" }
        tvoc: { $ref: "#/components/schemas/Tvoc" }
        pd: { type: [object, "null"] }
        health: { $ref: "#/components/schemas/DeviceHealth" }
        active_alarms: { type: array, items: { $ref: "#/components/schemas/Alarm" } }
        asset:
          description: "Varlik kunyesi (F-21). CBS aktarimi yapilmamissa null."
          oneOf:
            - { $ref: "#/components/schemas/AssetRegistry" }
            - { type: "null" }

    AlarmReason:
      type: object
      description: "Arayuzdeki 'Neden?' bolumu — her alarm aciklanabilir olmalidir (rapor 6.5 L4)"
      properties:
        signals:
          type: array
          items:
            type: object
            properties:
              tag: { type: string }
              value: { type: number }
              threshold: { type: number }
              unit: { type: string }
        layer: { type: string, enum: ["L-1", L0, L1, L2, L3] }
        basis: { type: string, description: "standart atfi, or. 'IEC 61439-1 Tablo 6'" }
        point: { type: [string, "null"] }

    Alarm:
      type: object
      required: [id, pano_id, code, prio, state, raised_at]
      properties:
        id: { type: string }
        event_id: { type: [string, "null"], description: "ayni kok nedenden gelen alarmlar bu id altinda gruplanir" }
        pano_id: { type: string }
        code: { type: string }
        text: { type: string, description: "Turkce alarm metni" }
        prio: { type: string, enum: [P1, P2, P3, INFO, SYS] }
        state: { type: string, enum: [active, acked, shelved, cleared] }
        raised_at: { type: string, format: date-time }
        cleared_at: { type: [string, "null"], format: date-time }
        acked_at: { type: [string, "null"], format: date-time }
        acked_by: { type: [string, "null"] }
        shelved_until: { type: [string, "null"], format: date-time }
        escalation_level: { type: integer, description: "0 = henuz eskalasyon yok" }
        notified: { type: array, items: { type: string, enum: [sms, whatsapp, call, scada, relay] } }
        reason: { $ref: "#/components/schemas/AlarmReason" }
        advice: { type: string, description: "'Ne yapmali?' — hypotheses[].advice" }
        ttl_h: { type: [number, "null"], description: "'Ne kadar acil?'" }

    Blackbox:
      type: object
      properties:
        event_id: { type: string }
        pano_id: { type: string }
        occurred_at: { type: string, format: date-time }
        code: { type: string }
        det_label: { type: [string, "null"] }
        window_h: { type: integer }
        series:
          type: object
          additionalProperties:
            type: array
            items:
              type: array
              prefixItems:
                - { type: integer }
                - { type: [number, "null"] }
        timeline:
          type: array
          items:
            type: object
            properties:
              ts: { type: string, format: date-time }
              kind: { type: string, enum: [alarm, ack, action, note, trip] }
              text: { type: string }

    FleetKpi:
      type: object
      properties:
        panels_total: { type: integer }
        comms_ok_pct: { type: number }
        alarms_per_100_panels_per_day: { type: number }
        active_by_prio:
          type: object
          additionalProperties: { type: integer }
        distribution_pct:
          type: object
          description: "gerceklesen oncelik dagilimi; hedef %5/%15/%80 (EEMUA 191)"
          additionalProperties: { type: number }
        p95_end_to_end_ms: { type: number, description: "sensor -> telefon gecikmesi" }
        ingest_msgs_per_s: { type: number }

# OpenAPI WebSocket'i kapsamaz; kanal sozlesmesi burada tanimlidir.
x-websocket:
  path: /api/v1/stream
  protocol: "JSON mesajlar, sunucudan istemciye tek yonlu"
  messages:
    - type: tel
      payload: "PanelSummary (degisen panolar icin)"
    - type: alarm
      payload: "Alarm (yeni, onaylanan veya temizlenen)"
    - type: kpi
      payload: FleetKpi
    - type: hello
      payload: "{ server_time, api_version }"
  reconnect: "istemci 2^n saniye (maks 30) ile yeniden baglanir; kopukken 'veri eski' seridi gosterilir"
