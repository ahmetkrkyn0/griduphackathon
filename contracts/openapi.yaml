# Merkez API — frontend'in tukettigi TEK arayuz.
# DONMUSTUR (PLAN.md kural 3). Ureten: Kisi B (backend/). Tuketen: Kisi C (frontend/).
# Kisi C alan adi UYDURMAZ; ihtiyac varsa contracts/changes/ altina oneri dosyasi acar.
openapi: 3.1.0
info:
  title: Grid Up — Pano Beyni Merkez API
  # v1.1.0 (18 Eylul 2026): GET /fleet/health eklendi. Yalnizca EKLEME, geri uyumlu.
  #   Gerekce: contracts/changes/2026-09-14-fleet-health-bulk.md
  # v1.2.0 (18 Eylul 2026): onay/raf govdesinden `by` KALKTI, securitySchemes eklendi (F-19).
  #   GERI UYUMLU DEGIL: onaylayanin adi artik govdeden degil Authorization basligindan
  #   turer. Eski istemcinin govdeye yazdigi `by` sessizce YOK SAYILIR (reddedilmez).
  #   Gerekce: contracts/changes/2026-09-18-kimlik-dogrulama.md
  # v1.3.0 (18 Eylul 2026): varlik kutugu (F-21). AssetRegistry semasi, PanelDetail.asset,
  #   PanelSummary'ye uc alan (abone_sayisi, kritiklik, sonraki_bakim_at) ve GET/POST
  #   /fleet/assets. Yalnizca EKLEME, geri uyumlu: yeni alanlarin hicbiri required degil ve
  #   kunye ice aktarilmamissa null doner.
  #   Gerekce: contracts/changes/2026-09-18-varlik-kutugu.md
  # v1.4.0 (18 Eylul 2026): ust sebeke kesintisi bagintisi (F-22). OutageEvent semasi,
  #   GET /outages + GET /outages/{outage_id}, Alarm'a outage_id. Yalnizca EKLEME, geri
  #   uyumlu: outage_id required degil ve baginti kurulmayan alarmda bulunmaz.
  #   Gerekce: contracts/changes/2026-09-18-kesinti-bagintisi.md
  # v1.5.0 (18 Eylul 2026): EPDK Madde 8 kesinti kaydi TASLAGI (F-23). EpdkKaydi semasi ve
  #   GET /outages/{outage_id}/epdk-kaydi. Yalnizca EKLEME, geri uyumlu.
  #   Gerekce: contracts/changes/2026-09-18-epdk-madde8-taslagi.md
  # v1.6.0 (18 Eylul 2026): L2 filo akran karsilastirmasi (F-32). GET /fleet/peers.
  #   Yalnizca EKLEME, geri uyumlu. YENI ALARM KODU YOK ve telemetri semasi DEGISMEDI:
  #   K0 kenardan yayinlanmaz, merkezde k / k_ratio ile YENIDEN TURETILIR.
  #   Gerekce: contracts/changes/2026-09-18-l2-filo-akran.md
  # v1.7.0 (18 Eylul 2026): dugum ve sensor kutugu (F-31). NodeRegistry semasi,
  #   GET/POST /fleet/nodes ve GET /fleet/nodes/blind. Yalnizca EKLEME, geri uyumlu.
  #   TELEMETRI SEMASI DEGISMEDI: dugum kimligi kenardan yayinlanmaz, "hangi parca kor"
  #   sorusu merkezde nokta kalite bitlerinden yeniden turetilir.
  #   Gerekce: contracts/changes/2026-09-18-dugum-kutugu-ve-sapma.md
  version: 1.7.0
  description: |
    On-prem izleme platformunun HTTP arayuzu. Tamami sirket ici aginda calisir,
    public cloud bagimliligi yoktur (PLAN.md GK4).
servers:
  - url: http://localhost:8000
    description: Gelistirme (dogrudan backend)
  - url: /
    description: Uretim (nginx arkasinda, frontend ile ayni koken)

tags:
  - name: panels
    description: Filo ve pano detayi
  - name: alarms
    description: ISA-18.2 alarm yasam dongusu
  - name: events
    description: Olay ve kara kutu
  - name: assets
    description: Varlik kutugu (CBS'den ice aktarilan kunye)
  - name: system

paths:
  /health:
    get:
      tags: [system]
      summary: Servis sagligi
      responses:
        "200":
          description: Calisiyor
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  version: { type: string }
                  mqtt: { type: boolean }
                  db: { type: boolean }
                  auth:
                    type: object
                    description: >
                      Kimlik dogrulamanin ACIK olup olmadigi. Kapali olmak SESSIZ bir
                      varsayilan olmamali: arayuz ve isletmeci durumu tek istekte
                      gorebilmeli (F-19).
                    properties:
                      enabled: { type: boolean }
                      users: { type: array, items: { type: string } }
                      protects:
                        type: array
                        items: { type: string }
                        description: "Belirtec isteyen uclarin listesi"

  /api/v1/panels:
    get:
      tags: [panels]
      summary: Filo listesi (risk skoruna gore siralanabilir)
      parameters:
        - { name: sort, in: query, schema: { type: string, enum: [risk, last_seen, pano_id], default: risk } }
        - { name: min_risk, in: query, schema: { type: integer, minimum: 0, maximum: 100 } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 2000 } }
      responses:
        "200":
          description: Pano ozetleri
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PanelSummary" }

  /api/v1/panels/{pano_id}:
    get:
      tags: [panels]
      summary: Tek pano detayi (dijital ikizi besler)
      parameters:
        - $ref: "#/components/parameters/PanoId"
      responses:
        "200":
          description: Pano detayi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanelDetail" }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/panels/{pano_id}/series:
    get:
      tags: [panels]
      summary: Zaman serisi (trend ve I^2-dT korelasyon grafikleri icin)
      parameters:
        - $ref: "#/components/parameters/PanoId"
        - name: tags
          in: query
          required: true
          description: "Virgulle ayrilmis etiketler, or. t_conn.GIRIS_L2.dt_c,elec.i_ph.1,k_index.DSYA3_L2"
          schema: { type: string }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: step, in: query, description: "ornekleme araligi, or. 10s / 1m / 15m", schema: { type: string, default: 1m } }
      responses:
        "200":
          description: "etiket -> [[ts_ms, deger]] dizisi"
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: array
                    prefixItems:
                      - { type: integer, description: "unix ms" }
                      - { type: [number, "null"] }

  /api/v1/alarms:
    get:
      tags: [alarms]
      summary: Alarm konsolu listesi
      parameters:
        - { name: state, in: query, schema: { type: string, default: "active,acked" }, description: "active,acked,shelved,cleared" }
        - { name: prio, in: query, schema: { type: string }, description: "P1,P2,P3,INFO,SYS" }
        - { name: pano_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
      responses:
        "200":
          description: Alarmlar (en yeni once)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Alarm" }

  /api/v1/alarms/{alarm_id}/ack:
    post:
      tags: [alarms]
      summary: Alarm onayi (ISA-18.2)
      parameters:
        - $ref: "#/components/parameters/AlarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
                channel: { type: string, enum: [ui, sms, scada], default: ui }
      security:
        - operatorToken: []
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Zaten onaylanmis veya temizlenmis"

  /api/v1/alarms/{alarm_id}/shelve:
    post:
      tags: [alarms]
      summary: Alarmi süreli ve gerekceli rafa al (P1 rafa alinamaz)
      parameters:
        - $ref: "#/components/parameters/AlarmId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes, reason]
              properties:
                minutes: { type: integer, minimum: 1, maximum: 480 }
                reason: { type: string, minLength: 3 }
      security:
        - operatorToken: []
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >
            P1 alarm rafa alinamaz (alarm-codes.yaml suppressible=false),
            VEYA belirtecin rolu yetmiyor ('operator' gerekir).

  /api/v1/events/{event_id}/blackbox:
    get:
      tags: [events]
      summary: Olay oncesi 72 saatlik kara kutu
      parameters:
        - { name: event_id, in: path, required: true, schema: { type: string } }
        - { name: window_h, in: query, schema: { type: integer, default: 72 } }
      responses:
        "200":
          description: Olay + oncesindeki sinyaller + zaman cizelgesi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Blackbox" }

  /api/v1/fleet/kpi:
    get:
      tags: [system]
      summary: Filo KPI'lari (ISA-18.2 hedefleriyle karsilastirmali)
      responses:
        "200":
          description: KPI ozeti
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetKpi" }

  /api/v1/fleet/health:
    get:
      tags: [system]
      summary: Tum filonun cihaz sagligi — tek istekte
      description: >
        Cihaz Sagligi ekrani icin. Bu uctan ONCE ekran gorunen her pano icin ayri ayri
        GET /panels/{id} cagiriyordu (sinirli eszamanlilikla); 20 panoda sorun degil,
        100+ panoda (GK7 hedefi) yavasliyordu. PanelSummary gibi HAFIF bir listedir:
        PanelDetail'in nokta dizisini, ortam ve elektrik bloklarini tasimaz.
      responses:
        "200":
          description: Filo genelinde cihaz sagligi listesi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PanelHealth" }

  /api/v1/fleet/nodes:
    get:
      tags: [nodes]
      summary: Dugum ve sensor kutugu — kunye, kapsama ve kalibrasyon vadesi
      description: >
        `health` blogu yalnizca nodes_ok / nodes_total SAYILARINI tasir: "kac dugum gitti"
        bilinir, "HANGI FIZIKSEL PARCA gitti" bilinmez. Bu kutuk onu kapatir — seri no,
        uretim partisi, montaj ve kalibrasyon vadesi.
        DIKKAT: bu bir KUTUK VE VADE TAKIBIDIR. "Izlenebilir olcum" (metrolojik
        izlenebilirlik) iddiasi akredite bir kalibrasyon zinciri olmadan kurulamaz ve
        KURULMUYOR; yanit bunu `uyari` alaninda acikca soyler. Sertifika numarasi alani
        bilerek ACILMADI: dolduracak gercek bir kaynak olmadan alan acmak GK10 ihlalidir.
        `kapsama` kac panonun kutugu oldugunu, kac dugumde seri no ve kalibrasyon vadesi
        BOS kaldigini sayiyla verir — eksiklik gizlenemez.
      parameters:
        - name: due_days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 3650, default: 30 }
          description: Kalibrasyon vadesine bu kadar gun kala "yaklasiyor" sayilir (TURETILMIS).
      responses:
        "200":
          description: Dugum kutugu, kapsama ozeti ve kalibrasyon vadesi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeFleet" }
    post:
      tags: [nodes]
      summary: Dugum kutugunu ice aktar
      description: >
        Kutugu toplu yazar. `kutuk_kaynak` ZORUNLUDUR — kaynagi yazilmayan kutuk kabul
        edilmez. Bilinmeyen pano_id REDDEDILIR (yeni pano yaratmaz). Gonderilmeyen alan
        DEGISTIRILMEZ; `points` verilirse o dugumun nokta eslemesi TAMAMEN degistirilir.
        Seri no ve uretim partisi gonderilmezse bos kalir; UYDURULMAZ.
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeImport" }
      responses:
        "200":
          description: Ice aktarim ozeti
          content:
            application/json:
              schema:
                type: object
                required: [guncellenen]
                properties:
                  guncellenen: { type: integer }
        "403":
          description: Yetersiz rol (muhendis gerekir)
        "404":
          description: Taninmayan pano_id; aktarimin TAMAMI geri alindi

  /api/v1/fleet/nodes/blind:
    get:
      tags: [nodes]
      summary: Hangi fiziksel parca kor — bozuk noktalardan dugume
      description: >
        F-31'in asil sorusu. Kenar zaten nokta basina kalite bitlerini (`t_conn[].q`)
        yayinliyor; kutuk nokta -> dugum eslemesini tuttugu icin "su noktalar bozuk"
        bilgisi burada "su fiziksel parca degismeli"ye cevrilir. Dugum kimligi TELEMETRIDE
        TASINMAZ (sema additionalProperties: false); merkezde YENIDEN TURETILIR — F-10'un
        `_verify` cozumuyle ayni kacis.
        Eslemesi OLMAYAN bozuk nokta gizlenmez: `kutuksuz_noktalar` listesinde doner.
        "Esleme yok" ile "sorun yok" ayni sey degildir.
      responses:
        "200":
          description: Kor dugumler ve kutuksuz kalan bozuk noktalar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlindNodes" }

  /api/v1/fleet/peers:
    get:
      tags: [system]
      summary: L2 filo akran karsilastirmasi ve yeniden baz alma onerisi
      description: >
        K/K0 bir noktayi yalnizca KENDI gecmisiyle olcer. Devreye alma gununde zaten
        gevsek olan bir baglantida taban BOZUK degeri dondurur (K yuksek, K0 ayni oranda
        yuksek, k_ratio 1,0) ve o nokta omru boyunca saglikli gorunur. Bu uc noktayi
        AKRANLARIYLA olcer: ayni ada sahip nokta baska panolarda hangi K0'lari veriyor?
        Akran grubu NOKTA ADIDIR (ayni ad = ayni cikis boyu = ayni anma akimi); skor
        MAD tabanli modifiye z'dir (ortalama/standart sapma kullanilsa bozuk panonun
        kendisi olcuye girer ve aradigimiz seyi saklardi).
        ALARM URETMEZ: sozlesmede `layer: L2` etiketli alarm kodu yoktur ve bu uc bir
        tane ACMAZ. Ciktisi operator onayina sunulan bir ONERIDIR; otomatik yeniden baz
        alma gercek bozulmayi susturur (docs/07b Y11).
        `points_unmeasurable` akran sayisi yetersiz oldugu icin SKORLANAMAYAN noktalari
        sayar: "olcemedik" ile "aykiri degil" ayni sey degildir.
      parameters:
        - name: min_peers
          in: query
          required: false
          schema: { type: integer, minimum: 2, maximum: 100, default: 8 }
          description: >
            Altinda karsilastirma yapilmayan akran sayisi. MAD ucuncu bir degerle
            tamamen degisir; varsayilan 8 medyanin her iki yaninda en az dorder deger
            birakir. Sozlesmede L2 esigi olmadigi icin TURETILMISTIR.
      responses:
        "200":
          description: Akran karsilastirmasi ozeti ve yeniden baz alma onerileri
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetPeers" }
        "503":
          description: panoalgo kutuphanesi yuklu degil (bu uc kapali, backend calisir)

  /api/v1/fleet/assets:
    get:
      tags: [assets]
      summary: Varlik kutugu — filonun kunyesi ve kapsama orani
      description: >
        Panolarin CBS'den ice aktarilan kunyesi (F-21). `kapsama` alani kac panonun
        kunyesi oldugunu SAYIYLA soyler: eksiklik gizlenemez. Kunyesi olmayan pano
        listede yine gorunur ve alanlari null doner — bos hucre "veri yok" demektir,
        sifir demek DEGILDIR.
      responses:
        "200":
          description: Kunye listesi + kapsama ozeti
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetFleet" }
    post:
      tags: [assets]
      summary: CBS aktarimindan varlik kunyesi ice aktar
      description: >
        Kunyeyi CBS disa aktarimindan toplu olarak yazar (F-21). Biz KAYNAK DEGIL
        TUKETICIYIZ: bu uc bir varlik ana kaydi olusturmaz, CBS'deki kaydi buraya
        kopyalar. `kunye_kaynak` ZORUNLUDUR — kaynagi yazilmayan kunye kabul edilmez.
        Bilinmeyen pano_id REDDEDILIR (yeni pano yaratmaz).
        `uretici` ve `seri_no` gonderilmezse bos kalir; UYDURULMAZ.
      security:
        - operatorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetImport" }
      responses:
        "200":
          description: Ice aktarim ozeti
          content:
            application/json:
              schema:
                type: object
                required: [guncellenen, kapsama]
                properties:
                  guncellenen: { type: integer, description: "kunyesi yazilan pano sayisi" }
                  kapsama: { $ref: "#/components/schemas/AssetCoverage" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/outages:
    get:
      tags: [events]
      summary: Ust sebeke kesintileri (es zamanli susan panolar tek olayda)
      description: >
        Ayni FIDERDEKI panolarin es zamanli susmasi N ayri ariza degil TEK bir kesinti
        olayidir (F-22). Baginti `panels.fider_id` uzerinden kurulur (F-21 kunyesi);
        fider bilgisi olmayan pano GRUPLANMAZ. Esikler alarm-codes.yaml
        `outage_min_panels` / `outage_window_min`.
      parameters:
        - name: state
          in: query
          description: "acik = suren kesintiler; hepsi = kapananlar dahil"
          schema: { type: string, enum: [acik, hepsi], default: acik }
      responses:
        "200":
          description: Kesinti olaylari, en yenisi once
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OutageEvent" }

  /api/v1/outages/{outage_id}:
    get:
      tags: [events]
      summary: Tek kesinti olayi
      parameters:
        - { name: outage_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Kesinti olayi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutageEvent" }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/outages/{outage_id}/epdk-kaydi:
    get:
      tags: [events]
      summary: EPDK Kalite Yonetmeligi Madde 8 kesinti kaydi TASLAGI
      description: >
        Kesinti olayini, mevzuatin saydigi alanlarla doldurulmus bir TASLAGA cevirir (F-23).
        CIKTI TASLAKTIR ve bu, semanin tasiyici yapisidir: her alan bir DURUM tasir —
        `olculen` / `oneri` / `elle_doldurulacak`. Olcmedigimiz alan yanittan DUSURULMEZ,
        bos gelir ve neden olcemedigimiz alanin icinde yazar. Sebep ve sinif ONERIDIR,
        karar degildir. Tazminat hesabi YOKTUR (GK10).
      parameters:
        - { name: outage_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Madde 8 kesinti kaydi taslagi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EpdkKaydi" }
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    PanoId:
      name: pano_id
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Z]{3}-[0-9]{5}$" }
    AlarmId:
      name: alarm_id
      in: path
      required: true
      schema: { type: string }

  responses:
    Ok:
      description: Basarili
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean }
    NotFound:
      description: Bulunamadi
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: >
        Belirtec yok, bicimi desteklenmiyor veya gecersiz. `WWW-Authenticate: Bearer`
        basligi doner. NOT: operator tablosu bos birakilirsa kimlik dogrulama KAPALIDIR
        ve bu yanit hic uretilmez; durum GET /health `auth.enabled` alanindan okunur.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: "Kimlik dogru ama rol yetmiyor (izleyici < operator < muhendis)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  securitySchemes:
    operatorToken:
      type: http
      scheme: bearer
      description: >
        On-prem operator belirteci (F-19). Kurumsal SSO/OIDC DEGILDIR: belirtecler
        yapilandirmada duran paylasilan sirlardir; parola, oturum suresi, yenileme ve
        iptal listesi yoktur. GK4 public cloud kimlik saglayicisini yasakladigi icin
        bulut IdP kullanilamaz. Yalnizca YAZMA uclarini (onay/raf) korur; okuma uclari
        ve WebSocket akisi belirtec istemez. Ayrinti: docs/15-guvenlik-kvkk.md §5.

  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string }

    EpdkAlan:
      type: object
      description: >
        Madde 8/2'nin TEK bir alani. `durum` alanin ne oldugunu soyler ve alan yanittan
        HICBIR ZAMAN dusurulmez: olcmedigimiz alani cikarmak, "bu alani olcmuyoruz"
        bilgisini de kaybettirirdi.
      required: [ad, durum]
      properties:
        ad: { type: string, description: "mevzuattaki alan adi, or. 'Etkilenen kullanici sayisi'" }
        deger:
          description: "Olculen ya da onerilen deger; elle doldurulacaksa null"
          type: [string, number, "null"]
        durum:
          type: string
          enum: [olculen, oneri, elle_doldurulacak]
          description: >
            olculen = bu depodan turetildi · oneri = sistem bir oneri uretti, KARAR DEGIL ·
            elle_doldurulacak = bu alani OLCMUYORUZ
        aciklama:
          type: string
          description: >
            Degerin NEREDEN geldigi ya da neden olcemedigimiz. Bos birakilmaz: durumu
            'elle_doldurulacak' olan alan, sebebini yazmak zorundadir.

    EpdkKaydi:
      type: object
      description: >
        EPDK Kalite Yonetmeligi (RG 29/12/2020, 31349 muk.) Madde 8/2 kesinti kaydi TASLAGI.
        Alan listesi backlog §2.1'de birebir dogrulandi.
      required: [taslak, uyari, outage_id, alanlar, ozet]
      properties:
        taslak:
          type: boolean
          description: "HER ZAMAN true. Bu cikti resmi bir kayit DEGILDIR."
        uyari: { type: string, description: "Ekranda ve ciktida gorunen TASLAK uyarisi" }
        outage_id: { type: string }
        alanlar:
          type: array
          description: "Madde 8/2'nin on alani, mevzuattaki sirayla"
          items: { $ref: "#/components/schemas/EpdkAlan" }
        ozet:
          type: object
          description: "Kac alanin olculdugu SAYIYLA verilir; eksiklik gizlenemez (GK10)."
          required: [toplam, olculen, oneri, elle_doldurulacak]
          properties:
            toplam:             { type: integer }
            olculen:            { type: integer }
            oneri:              { type: integer }
            elle_doldurulacak:  { type: integer }
        kanit:
          type: array
          description: >
            Kanit paketi: kesintiye dahil her pano icin MEVCUT kara kutu olayina baglanti.
            Yeni bir zaman cizelgesi URETILMEZ — GET /events/{event_id}/blackbox zaten var
            ve F-02 penceresini 336 saate cikardi.
          items:
            type: object
            required: [pano_id]
            properties:
              pano_id:  { type: string }
              name:     { type: string }
              event_id: { type: [string, "null"], description: "null = bu pano icin olay kaydi yok" }
              blackbox: { type: [string, "null"], description: "var olan kara kutu ucunun yolu" }

    OutageEvent:
      type: object
      description: >
        Ust sebeke kesintisi (F-22): ayni fiderde es zamanli susan N panonun TEK olayi.
        Bu bir ALARM DEGILDIR — alarmlari aciklayan bir olaydir; alt alarmlar
        (ALM-LASTGASP, ALM-COMMS-LOST) uretilmeye devam eder ve BASTIRILMAZ, yalnizca
        `outage_id` ile buna baglanir.
      required: [outage_id, fider_id, started_at, detected_at, panolar, state]
      properties:
        outage_id: { type: string, description: "or. OUT-F-EFELER-03-20260918T0900" }
        fider_id: { type: string, description: "kesintinin fideri (F-21 kunyesinden)" }
        started_at:
          type: string
          format: date-time
          description: >
            Panolarin sustugu an (kumedeki EN GEC son veri zamani). Bu, enerjinin
            kesildigi anin OLCULEBILEN en iyi yaklasimidir; kesme aninin kendisi
            gozlemlenmiyor.
        detected_at:
          type: string
          format: date-time
          description: "Merkezin bagintiyi kurdugu an (haberlesme zaman asimi kadar sonra)"
        ended_at:
          type: [string, "null"]
          format: date-time
          description: >
            Haberlesmenin GERI DONDUGU an. DIKKAT: bu enerjinin geri geldigi an DEGILDIR
            ve histerezislidir; restorasyon ani bu depoda olculmuyor (F-23).
        state: { type: string, enum: [acik, kapandi] }
        panolar:
          type: array
          description: "Olaya bagli panolar"
          items:
            type: object
            required: [pano_id, last_rx]
            properties:
              pano_id: { type: string }
              name: { type: string }
              last_rx: { type: string, format: date-time }
              abone_sayisi: { type: [integer, "null"], description: "kunyeden; null = bilinmiyor" }
        abone_toplami:
          type: [integer, "null"]
          description: >
            Etkilenen abone sayisinin TOPLAMI (EPDK Madde 8/2). Yalnizca kunyesi olan
            panolar toplanir ve `abone_eksik` kac panonun sayilamadigini soyler; hicbir
            panonun kunyesi yoksa null doner — SIFIR YAZILMAZ.
        abone_eksik:
          type: integer
          description: "abone sayisi bilinmediği icin toplama girmeyen pano sayisi"

    AssetRegistry:
      type: object
      description: >
        Panonun CBS'den ice aktarilan kunyesi (F-21). Bu bir VARLIK ANA KAYDI DEGILDIR:
        EPDK CBS usul ve esaslari panoyu zaten tekil kodla tutmayi zorunlu kiliyor, yani
        kimlik musteride var ve biz tuketiciyiz. Ice aktarilmamis her alan null'dur;
        null "olcmedik/almadik" demektir, sifir demek degildir.
      properties:
        cbs_kodu:
          type: [string, "null"]
          description: >
            EPDK CBS tekil sebeke unsuru kodu. Urun seviyesinde BIRINCIL kimliktir;
            veritabani birincil anahtari pano_id olarak KALIR (yabanci anahtarlar ona bagli).
            EPDK Kalite Yonetmeligi Madde 8/2'nin "yer" alanindaki tekil kodu besler.
        fider_id:
          type: [string, "null"]
          description: "Panonun beslendigi fider. F-22 es zamanli susmayi bu alana gore gruplar."
        il:    { type: [string, "null"], description: "Madde 8/2 'yer'; pano_id onekinden TURETILMEZ" }
        ilce:  { type: [string, "null"] }
        abone_sayisi:
          type: [integer, "null"]
          description: >
            Madde 8/2 "etkilenen kullanici sayisi". Risk matrisinin ETKI eksenidir:
            sayilabilir bir buyukluktur ve bir taksonomi icat etmeyi gerektirmez.
        trafo_kva:
          type: [integer, "null"]
          description: >
            Pano BASINA trafo gucu. pano_type ('1600kVA-dahili') kVA'yi tasir ama filodaki
            her panoda AYNIDIR; sabit bir alani etki gibi gostermek yaniltici olurdu.
        kritiklik:
          type: [string, "null"]
          enum: [kritik, yuksek, orta, dusuk, null]
          description: >
            CBS/varlik yonetiminden ICE AKTARILAN etiket; bizim tanimladigimiz bir sozluk
            DEGILDIR. Erisilebilir bir standart siniflandirma bulunamadi ve GK10 geregi
            erisemedigimiz bir metnin madde numarasi yazilmaz. Sinirli sozluk, uydurma veri
            uretmek icin degil AKTARIMI DOGRULAMAK icindir.
        uretici:
          type: [string, "null"]
          description: >
            UYDURULMAZ, bos birakilir. Bu teslimde hicbir panoda doldurulmadi ve demo tohumu
            da doldurmaz (GK3: gercek bir CBS aktarimina erisim yok).
        seri_no:
          type: [string, "null"]
          description: "UYDURULMAZ, bos birakilir (bkz. uretici)."
        son_bakim_at:     { type: [string, "null"], format: date-time }
        sonraki_bakim_at: { type: [string, "null"], format: date-time, description: "bakim vadesi rozetini besler" }
        kunye_kaynak:
          type: [string, "null"]
          description: >
            Kunyenin NEREDEN geldigi (hangi CBS aktarimi). Kaynagi yazilmayan kunye kabul
            edilmez: "alan acip bos birakmak" ile "tanimli kaynagi olan alan" farki budur.
        kunye_at: { type: [string, "null"], format: date-time, description: "ice aktarim ani" }

    AssetCoverage:
      type: object
      description: "Kapsama SAYIYLA verilir ki eksiklik gizlenemesin (GK10)."
      required: [panolar, kunyeli]
      properties:
        panolar:  { type: integer, description: "filodaki toplam pano" }
        kunyeli:  { type: integer, description: "cbs_kodu girilmis pano" }
        fiderli:  { type: integer, description: "fider_id girilmis pano (F-22 bunu kullanir)" }
        aboneli:  { type: integer, description: "abone_sayisi girilmis pano (etki ekseni)" }

    NodeRegistry:
      type: object
      required: [node_id, pano_id]
      description: >
        Tek bir fiziksel dugum/sensor. Ice aktarilmayan alan null doner — bos hucre
        "veri yok" demektir, sifir DEGIL. `seri_no` ve `uretim_partisi` uydurulmaz.
      properties:
        node_id:        { type: string }
        pano_id:        { type: string }
        uretici:        { type: [string, "null"] }
        model:          { type: [string, "null"] }
        seri_no:        { type: [string, "null"] }
        uretim_partisi: { type: [string, "null"] }
        montaj_at:      { type: [string, "null"], format: date-time }
        son_kalibrasyon_at:     { type: [string, "null"], format: date-time }
        sonraki_kalibrasyon_at: { type: [string, "null"], format: date-time }
        kutuk_kaynak:   { type: [string, "null"] }
        kutuk_at:       { type: [string, "null"], format: date-time }

    NodeFleet:
      type: object
      required: [kapsama, kalibrasyon, dugumler, uyari]
      properties:
        kapsama:
          type: object
          required: [pano_toplam, kutugu_olan_pano, dugum_toplam, seri_no_bos, kalibrasyon_vadesi_bos]
          description: Eksiklik SAYIYLA gorunur; kutugu olmayan pano gizlenmez.
          properties:
            pano_toplam:      { type: integer }
            kutugu_olan_pano: { type: integer }
            dugum_toplam:     { type: integer }
            seri_no_bos:      { type: integer }
            kalibrasyon_vadesi_bos: { type: integer }
        kalibrasyon:
          type: object
          required: [pencere_gun, vadesi_gecen, vadesi_yaklasan]
          properties:
            pencere_gun:     { type: integer }
            vadesi_gecen:    { type: array, items: { type: string } }
            vadesi_yaklasan: { type: array, items: { type: string } }
        dugumler:
          type: array
          items: { $ref: "#/components/schemas/NodeRegistry" }
        uyari:
          type: string
          description: >
            GK10/GK3 notu: bu kutuk kalibrasyon VADE TAKIBIDIR; akredite kalibrasyon
            olmadan "izlenebilir olcum" iddiasi kurulamaz.

    NodeImport:
      type: object
      required: [kutuk_kaynak, dugumler]
      properties:
        kutuk_kaynak:
          type: string
          minLength: 1
          description: Kaynagi yazilmayan kutuk kabul edilmez; satir basina YAZILAMAZ.
        dugumler:
          type: array
          minItems: 1
          items:
            allOf:
              - $ref: "#/components/schemas/NodeRegistry"
              - type: object
                properties:
                  points:
                    type: array
                    items: { type: string }
                    description: >
                      Dugumun tasidigi olcum noktalari. Verilirse esleme TAMAMEN
                      degistirilir; kismi esleme eski ve yeni kartin noktalarini karistirirdi.

    BlindNodes:
      type: object
      required: [kor_dugumler, kutuksuz_noktalar]
      properties:
        kor_dugumler:
          type: array
          description: Kalite bayragi tasiyan noktalari olan dugumler, kutuk kunyesiyle.
          items:
            allOf:
              - $ref: "#/components/schemas/NodeRegistry"
              - type: object
                required: [points]
                properties:
                  points:
                    type: array
                    items:
                      type: object
                      required: [point, q]
                      properties:
                        point:     { type: string }
                        det_label: { type: [string, "null"] }
                        q:         { type: integer, description: "t_conn[].q bit alani" }
        kutuksuz_noktalar:
          type: array
          description: >
            Bozuk ama kutuge eslenmemis noktalar. "Esleme yok" ile "sorun yok" ayni sey
            degildir; bu liste eksikligi gorunur kilar (GK10).
          items:
            type: object
            required: [pano_id, point]
            properties:
              pano_id: { type: string }
              point:   { type: string }

    FleetPeers:
      type: object
      required: [panels_compared, points_scored, points_unmeasurable, min_peers, outlier_z, rebaseline_suggestions, uyari]
      properties:
        panels_compared:
          type: integer
          description: K0'i TURETILEBILEN pano sayisi (tabani donmamis pano sayilmaz).
        points_scored:
          type: integer
          description: Akran sayisi yeterli oldugu icin robust z hesaplanan nokta sayisi.
        points_unmeasurable:
          type: integer
          description: >
            Akran sayisi yetersiz oldugu icin SKORLANAMAYAN nokta sayisi. Bu noktalar
            "aykiri degil" DEGIL, "olculemedi" demektir (GK10).
        min_peers: { type: integer }
        outlier_z:
          type: number
          description: Aykiri sayilma esigi (modifiye z). Sozlesmede L2 esigi yoktur; TURETILMIS.
        rebaseline_suggestions:
          type: array
          description: >
            Tabani supheli bulunan noktalar. ONERIDIR, uygulanmis bir islem DEGILDIR —
            yeniden baz alma kararini operator verir.
          items:
            type: object
            required: [pano_id, point, k0, peer_median, n_peers, reasons]
            properties:
              pano_id:     { type: string }
              point:       { type: string, description: "t_conn[].pt nokta adi" }
              det_label:   { type: string, description: "Insan okur etiket" }
              k0:          { type: number, description: "Merkezde k / k_ratio ile turetilen taban" }
              peer_median: { type: number }
              robust_z:    { oneOf: [{ type: number }, { type: "null" }] }
              n_peers:     { type: integer }
              reasons:
                type: array
                items: { type: string }
                description: Onerinin gerekcesi; gerekcesiz oneri uretilmez.
        uyari:
          type: string
          description: >
            GK10 notu. Sentetik filoda saglikli K0 sinirli duzgun dagilimdan gelir ve
            saglikli bir pano YAPISAL OLARAK aykiri cikamaz; bu veriden cikan ayrim
            orani saha basarimi olarak sunulamaz.

    AssetFleet:
      type: object
      required: [kapsama, panolar]
      properties:
        kapsama: { $ref: "#/components/schemas/AssetCoverage" }
        panolar:
          type: array
          items:
            type: object
            required: [pano_id]
            properties:
              pano_id: { type: string }
              name:    { type: string }
              asset:   { oneOf: [{ $ref: "#/components/schemas/AssetRegistry" }, { type: "null" }] }

    AssetImport:
      type: object
      required: [kunye_kaynak, panolar]
      properties:
        kunye_kaynak:
          type: string
          minLength: 1
          description: "ZORUNLU. Aktarimin kimligi, or. 'ADM CBS disa aktarim 2026-09-18'."
        panolar:
          type: array
          minItems: 1
          items:
            type: object
            required: [pano_id]
            description: >
              pano_id disindaki her alan istege baglidir; GONDERILMEYEN alan DEGISTIRILMEZ
              (mevcut deger korunur). Bir alani temizlemek icin acikca null gonderilir.
            properties:
              pano_id:      { type: string }
              cbs_kodu:     { type: [string, "null"] }
              fider_id:     { type: [string, "null"] }
              il:           { type: [string, "null"] }
              ilce:         { type: [string, "null"] }
              abone_sayisi: { type: [integer, "null"], minimum: 0 }
              trafo_kva:    { type: [integer, "null"], minimum: 0 }
              kritiklik:    { type: [string, "null"], enum: [kritik, yuksek, orta, dusuk, null] }
              uretici:      { type: [string, "null"] }
              seri_no:      { type: [string, "null"] }
              son_bakim_at:     { type: [string, "null"], format: date-time }
              sonraki_bakim_at: { type: [string, "null"], format: date-time }

    PanelSummary:
      type: object
      required: [pano_id, name, risk_score, risk_mode, last_seen, comms_ok]
      properties:
        pano_id: { type: string }
        name: { type: string, description: "or. Efeler TM-14" }
        lat: { type: [number, "null"] }
        lon: { type: [number, "null"] }
        pano_type: { type: string, description: "1600kVA-dahili" }
        risk_score: { type: integer, minimum: 0, maximum: 100 }
        risk_mode: { type: string, description: "alarm-codes.yaml hypotheses[].code" }
        risk_trend: { type: string, enum: [up, flat, down] }
        top_alarm: { type: [string, "null"], description: "en yuksek oncelikli aktif alarm kodu" }
        top_prio: { type: [string, "null"], enum: [P1, P2, P3, INFO, SYS, null] }
        ttl_h: { type: [number, "null"], description: "sinira kalan sure (saat)" }
        last_seen: { type: string, format: date-time }
        comms_ok: { type: boolean }
        baseline_day: { type: integer }
        # --- varlik kutugu (F-21). Kunye ice aktarilmamissa UCU DE null doner.
        # Ozete yalnizca bu uc alan girdi: risk matrisinin etki ekseni (abone_sayisi),
        # onceliklendirme (kritiklik) ve bakim vadesi rozeti (sonraki_bakim_at). Kunyenin
        # tamami PanelDetail.asset'tedir — filo listesi 1.000 pano tasiyabilmeli.
        abone_sayisi: { type: [integer, "null"], description: "etki ekseni; null = kunye yok" }
        kritiklik: { type: [string, "null"], enum: [kritik, yuksek, orta, dusuk, null] }
        sonraki_bakim_at: { type: [string, "null"], format: date-time }

    ConnPoint:
      type: object
      required: [pt, t_c, dt_c]
      properties:
        pt: { type: string }
        label: { type: string, description: "Turkce gosterim adi, or. 'Giris L2'" }
        t_c: { type: number }
        dt_c: { type: number }
        k: { type: [number, "null"] }
        k_ratio: { type: [number, "null"] }
        tau_s: { type: [number, "null"] }
        ttl_h: { type: [number, "null"] }
        excited: { type: boolean }
        q: { type: integer, description: "0 = temiz" }
        state: { type: string, enum: [normal, warn, alarm, critical, stale] }

    Env:
      type: object
      properties:
        t_low_c: { type: number }
        rh_low_pct: { type: number }
        td_low_c: { type: number }
        td_margin_k: { type: number }
        t_up_c: { type: number }
        rh_up_pct: { type: number }
        dt_air_k: { type: number }
        voc_idx: { type: [number, "null"] }
        door_open: { type: boolean }

    Elec:
      type: object
      properties:
        i_ph: { type: array, items: { type: number } }
        i_n: { type: number }
        u_ph: { type: array, items: { type: number } }
        thd_i: { type: array, items: { type: number } }
        cosphi: { type: number }
        unbal_pct: { type: number }
        mpr_comm_ok: { type: boolean }

    Tvoc:
      type: object
      properties:
        trips: { type: integer }
        state: { type: integer }
        last_trip_at: { type: [string, "null"], format: date-time }
        last_det_label: { type: [string, "null"], description: "or. 'X2:4' — pano icindeki konum" }
        prot_health_ok: { type: boolean }
        comm_ok: { type: boolean }

    DeviceHealth:
      type: object
      properties:
        uptime_s: { type: integer }
        nodes_ok: { type: integer }
        nodes_total: { type: integer }
        rssi_dbm: { type: number }
        vbak_pct: { type: number }
        buffered: { type: integer }
        maint_mode: { type: boolean }
        fw: { type: string }

    PanelHealth:
      type: object
      description: >
        GET /fleet/health satiri. Alanlar DeviceHealth ile ayni adlari tasir; pano_id,
        name, last_seen ve comms_ok PanelSummary ile ayni anlamdadir. Telemetri hic
        gelmemis bir pano icin saglik alanlari null doner — olmayan veri 0 gibi
        gosterilmez (0 dBm gecerli bir RSSI'dir, "bilinmiyor" degildir).
      required: [pano_id, name, last_seen, comms_ok]
      properties:
        pano_id: { type: string }
        name: { type: string }
        nodes_ok: { type: [integer, "null"] }
        nodes_total: { type: [integer, "null"] }
        rssi_dbm: { type: [number, "null"] }
        vbak_pct: { type: [number, "null"] }
        buffered: { type: [integer, "null"] }
        maint_mode: { type: [boolean, "null"] }
        fw: { type: [string, "null"] }
        baseline_day: { type: integer }
        last_seen: { type: string, format: date-time }
        comms_ok: { type: boolean }

    PanelDetail:
      type: object
      required: [pano_id, ts, points, env, elec, health]
      properties:
        pano_id: { type: string }
        name: { type: string }
        pano_type: { type: string }
        ts: { type: string, format: date-time }
        risk_score: { type: integer }
        risk_mode: { type: string }
        risk_contributions:
          type: object
          additionalProperties: { type: number }
          description: "alarm kodu -> katki (0-1); 'Neden?' bolumunu besler"
        points: { type: array, items: { $ref: "#/components/schemas/ConnPoint" } }
        env: { $ref: "#/components/schemas/Env" }
        elec: { $ref: "#/components/schemas/Elec" }
        tvoc: { $ref: "#/components/schemas/Tvoc" }
        pd: { type: [object, "null"] }
        health: { $ref: "#/components/schemas/DeviceHealth" }
        active_alarms: { type: array, items: { $ref: "#/components/schemas/Alarm" } }
        asset:
          description: "Varlik kunyesi (F-21). CBS aktarimi yapilmamissa null."
          oneOf:
            - { $ref: "#/components/schemas/AssetRegistry" }
            - { type: "null" }

    AlarmReason:
      type: object
      description: "Arayuzdeki 'Neden?' bolumu — her alarm aciklanabilir olmalidir (rapor 6.5 L4)"
      properties:
        signals:
          type: array
          items:
            type: object
            properties:
              tag: { type: string }
              value: { type: number }
              threshold: { type: number }
              unit: { type: string }
        layer: { type: string, enum: ["L-1", L0, L1, L2, L3] }
        basis: { type: string, description: "standart atfi, or. 'IEC 61439-1 Tablo 6'" }
        point: { type: [string, "null"] }

    Alarm:
      type: object
      required: [id, pano_id, code, prio, state, raised_at]
      properties:
        id: { type: string }
        event_id: { type: [string, "null"], description: "ayni kok nedenden gelen alarmlar bu id altinda gruplanir (PANO ICI)" }
        outage_id:
          type: [string, "null"]
          description: >
            Alarm bir ust sebeke kesintisine baglandiysa o kesintinin kimligi (F-22).
            event_id PANO ICI gruplamadir; bu alan PANOLAR ARASI bagintidir. Baginti
            alarmi BASTIRMAZ, yalnizca baglar.

        pano_id: { type: string }
        code: { type: string }
        text: { type: string, description: "Turkce alarm metni" }
        prio: { type: string, enum: [P1, P2, P3, INFO, SYS] }
        state: { type: string, enum: [active, acked, shelved, cleared] }
        raised_at: { type: string, format: date-time }
        cleared_at: { type: [string, "null"], format: date-time }
        acked_at: { type: [string, "null"], format: date-time }
        acked_by: { type: [string, "null"] }
        shelved_until: { type: [string, "null"], format: date-time }
        escalation_level: { type: integer, description: "0 = henuz eskalasyon yok" }
        notified: { type: array, items: { type: string, enum: [sms, whatsapp, call, scada, relay] } }
        reason: { $ref: "#/components/schemas/AlarmReason" }
        advice: { type: string, description: "'Ne yapmali?' — hypotheses[].advice" }
        ttl_h: { type: [number, "null"], description: "'Ne kadar acil?'" }

    Blackbox:
      type: object
      properties:
        event_id: { type: string }
        pano_id: { type: string }
        occurred_at: { type: string, format: date-time }
        code: { type: string }
        det_label: { type: [string, "null"] }
        window_h: { type: integer }
        series:
          type: object
          additionalProperties:
            type: array
            items:
              type: array
              prefixItems:
                - { type: integer }
                - { type: [number, "null"] }
        timeline:
          type: array
          items:
            type: object
            properties:
              ts: { type: string, format: date-time }
              kind: { type: string, enum: [alarm, ack, action, note, trip] }
              text: { type: string }

    FleetKpi:
      type: object
      properties:
        panels_total: { type: integer }
        comms_ok_pct: { type: number }
        alarms_per_100_panels_per_day: { type: number }
        active_by_prio:
          type: object
          additionalProperties: { type: integer }
        distribution_pct:
          type: object
          description: "gerceklesen oncelik dagilimi; hedef %5/%15/%80 (EEMUA 191)"
          additionalProperties: { type: number }
        p95_end_to_end_ms: { type: number, description: "sensor -> telefon gecikmesi" }
        ingest_msgs_per_s: { type: number }

# OpenAPI WebSocket'i kapsamaz; kanal sozlesmesi burada tanimlidir.
x-websocket:
  path: /api/v1/stream
  protocol: "JSON mesajlar, sunucudan istemciye tek yonlu"
  messages:
    - type: tel
      payload: "PanelSummary (degisen panolar icin)"
    - type: alarm
      payload: "Alarm (yeni, onaylanan veya temizlenen)"
    - type: kpi
      payload: FleetKpi
    - type: hello
      payload: "{ server_time, api_version }"
  reconnect: "istemci 2^n saniye (maks 30) ile yeniden baglanir; kopukken 'veri eski' seridi gosterilir"
