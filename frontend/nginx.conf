# Arayuz ile API ayni kokenden servis edilir: CORS sorunu ve ayri port karmasasi olmaz.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker'in gomulu DNS sunucusu. Bu iki satir olmadan nginx "backend" adini
    # YALNIZCA acilista bir kez cozer ve IP'yi omur boyu onbellekte tutar; backend
    # konteyneri yeniden baslayip yeni bir IP aldiginda (dagitim, OOM, cokme) tum
    # /api cagrilari 502 doner ve operator ekrani, frontend elle yeniden baslatilana
    # kadar olu kalir. `resolver` + proxy_pass'te DEGISKEN kullanimi, cozumlemeyi
    # istek anina erteler; valid=10s ile en fazla 10 saniyede kendini toparlar.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gridup_backend backend;

    # SPA yonlendirmesi (Faz 1'de React Router devreye girince gerekli)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket: canli telemetri ve alarm akisi
    location /api/v1/stream {
        # Degiskenli proxy_pass URI'yi KENDILIGINDEN eklemez; $request_uri ile
        # sorgu dizesi dahil ozgun yolu acikca gecmek zorundayiz.
        proxy_pass http://$gridup_backend:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://$gridup_backend:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://$gridup_backend:8000/health;
    }
}
