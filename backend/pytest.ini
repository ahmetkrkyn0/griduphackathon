[pytest]
# Hem `cd backend && pytest` hem de repo kokunden `pytest backend/tests` calisir:
# rootdir = backend/, `app` paketi buradan import edilir.
# ../libs/panoalgo: merkez dedektor (panoalgo.central) testlerde de yuklensin.
# Uretimde Dockerfile paketi imaja kurar; burada kurulum gerektirmeden yola eklenir.
pythonpath = . ../libs/panoalgo
testpaths = tests
addopts = -ra
markers =
    integration: gercek TimescaleDB ister (TEST_DB_DSN tanimli degilse atlanir)
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # starlette TestClient'in eski anyio takma adi (ucuncu parti; bizim kodumuzu etkilemez)
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
