[pytest]
# Hem `cd sim && pytest` hem de repo kokunden `pytest sim/tests` calisir.
# rootdir = sim/; `panoalgo` paketi libs/ altindan, sim modulleri buradan gelir
# (backend/pytest.ini ve libs/panoalgo/pyproject.toml ile ayni desen).
pythonpath = . ../libs/panoalgo
testpaths = tests
addopts = -ra
markers =
    slow: gercek bir TCP sunucusu ayaga kaldirir (birkac saniye)
